<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form đăng ký học viên</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        form {
            width: 500px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: inline-block;
            width: 140px;
            margin-bottom: 10px;
        }

        input, select {
            margin-bottom: 10px;
        }

        .buttons {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<form method="get" action="#">

    <h2>FORM ĐĂNG KÝ</h2>

    <p>
        <label>Họ và tên:</label>
        <input type="text" name="yourname">
    </p>

    <p>
        <label>Email:</label>
        <input type="email" name="email">
    </p>

    <p>
        <label>Sở thích:</label>
        <input type="checkbox" name="hobby" value="reading"> Đọc sách
        <br>
        <label></label>
        <input type="checkbox" name="hobby" value="music"> Âm nhạc
        <br>
        <label></label>
        <input type="checkbox" name="hobby" value="sport"> Thể thao
        <br>
        <label></label>
        <input type="checkbox" name="hobby" value="travel"> Du lịch
    </p>

    <p>
        <label>Ngày sinh:</label>
        <input type="date" name="birthdate">
    </p>

    <p>
        <label>Giới tính:</label>
        <input type="radio" name="gender" value="male"> Nam
        <input type="radio" name="gender" value="female"> Nữ
    </p>

    <p>
        <label>Địa chỉ:</label>
        <input type="text" name="address">
    </p>

    <p>
        <label>Lớp học:</label>
        <select name="class">
            <option value="">-- Chọn lớp --</option>
            <option value="class1">Lớp 1</option>
            <option value="class2">Lớp 2</option>
            <option value="class3">Lớp 3</option>
        </select>
    </p>

    <p>
        <label>Số điện thoại:</label>
        <input type="tel" name="phone">
    </p>

    <div class="buttons">
        <input type="submit" value="Gửi thông tin">
        <input type="reset" value="Nhập lại">
    </div>

</form>

</body>
</html>
